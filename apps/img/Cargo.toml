[package]
name = "img"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local Rust-native GIF operation stack"

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
color_quant = "1.1"
gif = "0.13"
image = { version = "0.25", default-features = false, features = [
  "gif",
  "png",
  "jpeg",
] }
tempfile = "3"

# Rune is pre-release; keep both crates on the same tested revision.
rune = { git = "https://github.com/anomalyco/rune", rev = "938ba14f09bb3381946b3486ef8aa36363a3e8b2", default-features = false, features = [
  "accessibility",
  "svg",
  "metal-backend",
  "native-file-dialog",
] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "938ba14f09bb3381946b3486ef8aa36363a3e8b2" }
fontdb = "0.24"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22"

[profile.dev.package."*"]
debug = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSColor",
  "NSColorSpace",
  "NSColorSampler",
  "block2",
  "objc2-core-foundation",
] }

[[test]]
name = "cli"
path = "__tests__/cli.rs"

[[test]]
name = "composites"
path = "__tests__/composites.rs"

[[test]]
name = "gif_safety"
path = "__tests__/gif_safety.rs"

[[test]]
name = "negate"
path = "__tests__/negate.rs"

[[test]]
name = "operations"
path = "__tests__/operations.rs"

[[test]]
name = "pipeline"
path = "__tests__/pipeline.rs"

[[test]]
name = "render_cache"
path = "__tests__/render_cache.rs"

[[test]]
name = "seeded_operations"
path = "__tests__/seeded_operations.rs"

[[test]]
name = "seeded_pipeline"
path = "__tests__/seeded_pipeline.rs"
