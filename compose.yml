services:
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      TEA_DATA_DIR: /app/data
    volumes:
      - cms-data:/app/data
    configs:
      - source: andrew-local-site
        target: /app/apps/cms/sites/andrew/site.local.json
      - source: luke-local-site
        target: /app/apps/cms/sites/luke/site.local.json
    labels:
      traefik.enable: "true"
      traefik.http.routers.cms-andrew.rule: "Host(`andrew.localhost`)"
      traefik.http.routers.cms-andrew.entrypoints: web
      traefik.http.routers.cms-andrew.service: cms
      traefik.http.routers.cms-luke.rule: "Host(`luke.localhost`)"
      traefik.http.routers.cms-luke.entrypoints: web
      traefik.http.routers.cms-luke.service: cms
      traefik.http.services.cms.loadbalancer.server.port: "4351"
    networks:
      - web

  shell-mcp:
    build:
      context: .
      dockerfile: apps/shell-mcp/Dockerfile
    environment:
      SHELL_MODE: locked
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_ORIGIN: http://shell.localhost
    labels:
      traefik.enable: "true"
      traefik.http.routers.shell-mcp.rule: "Host(`shell.localhost`)"
      traefik.http.routers.shell-mcp.entrypoints: web
      traefik.http.services.shell-mcp.loadbalancer.server.port: "3000"
    networks:
      - web

  artbin:
    build:
      context: .
      dockerfile: apps/artbin/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      ARTBIN_URL: http://artbin.localhost
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.jackharrhy.dev}
      AUTH_CLIENT_ID: ${ARTBIN_AUTH_CLIENT_ID:-}
      AUTH_PROJECT_ID: ${AUTH_ARTBIN_PROJECT_ID:-}
      AUTH_ORGANIZATION_ID: ${AUTH_ORGANIZATION_ID:-}
      AUTH_INTROSPECTION_CLIENT_ID: ${ARTBIN_AUTH_INTROSPECTION_CLIENT_ID:-}
      AUTH_INTROSPECTION_SECRET: ${ARTBIN_AUTH_INTROSPECTION_SECRET:-}
    volumes:
      - artbin-data:/app/apps/artbin/data
      - artbin-uploads:/app/apps/artbin/public/uploads
      - artbin-tmp:/app/apps/artbin/tmp/uploads
    labels:
      traefik.enable: "true"
      traefik.http.routers.artbin.rule: "Host(`artbin.localhost`)"
      traefik.http.routers.artbin.entrypoints: web
      traefik.http.services.artbin.loadbalancer.server.port: "3000"
    networks:
      - web

  marky:
    build:
      context: .
      dockerfile: apps/marky/Dockerfile
    environment:
      MARKY_AUTH: anonymous
      MARKY_CONTENT_DIR: /app/data/content
    volumes:
      - marky-data:/app/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.marky.rule: "Host(`md.localhost`)"
      traefik.http.routers.marky.entrypoints: web
      traefik.http.services.marky.loadbalancer.server.port: "44100"
    networks:
      - web

  letters-to-steve:
    build:
      context: .
      dockerfile: apps/letters-to-steve/Dockerfile
    environment:
      STEVE_ADMIN_PASSWORD: ${STEVE_ADMIN_PASSWORD:-tea-letters-local-password}
      DATABASE_PATH: /app/data/letters.sqlite
      UPLOAD_DIRECTORY: /app/data/uploads
      TRUST_PROXY: "true"
    volumes:
      - letters-to-steve-data:/app/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.letters-to-steve.rule: "Host(`letters.localhost`)"
      traefik.http.routers.letters-to-steve.entrypoints: web
      traefik.http.services.letters-to-steve.loadbalancer.server.port: "44110"
    networks:
      - web

  ref:
    build:
      context: .
      dockerfile: apps/ref/Dockerfile
    environment:
      CELLD_VAR_REF_PASSWORD: ${REF_PASSWORD:-tea-ref-local-password}
    volumes:
      - ref-data:/app/.celld
    labels:
      traefik.enable: "true"
      traefik.http.routers.ref.rule: "Host(`ref.localhost`)"
      traefik.http.routers.ref.entrypoints: web
      traefik.http.services.ref.loadbalancer.server.port: "8080"
    networks:
      - web

  radio:
    build:
      context: .
      dockerfile: apps/radio/Dockerfile
    environment:
      CELLD_VAR_RADIO_PASSWORD: ${RADIO_PASSWORD:-tea-radio-local-password}
      CELLD_VAR_RADIO_SESSION_SECRET: ${RADIO_SESSION_SECRET:-tea-radio-local-session-secret-change-me}
    volumes:
      - radio-data:/app/.celld
    labels:
      traefik.enable: "true"
      traefik.http.routers.radio.rule: "Host(`radio.localhost`)"
      traefik.http.routers.radio.entrypoints: web
      traefik.http.services.radio.loadbalancer.server.port: "44100"
    networks:
      - web

  maps:
    build:
      context: .
      dockerfile: apps/maps/Dockerfile
    environment:
      CELLD_VAR_MAPS_SERVICE_ORIGIN: http://maps-service:8792
      CELLD_VAR_MAPS_COLLABORATION_ORIGIN: http://maps-collaboration:44100
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - maps-data:/app/.celld
    depends_on:
      - maps-service
      - maps-collaboration
    labels:
      traefik.enable: "true"
      traefik.http.routers.maps.rule: "Host(`maps.localhost`)"
      traefik.http.routers.maps.entrypoints: web
      traefik.http.services.maps.loadbalancer.server.port: "8790"
    networks:
      - web

  maps-collaboration:
    build:
      context: .
      dockerfile: apps/maps-collaboration/Dockerfile
    environment:
      CELLD_VAR_TEA_MAPS_REALTIME_TICKET_SECRET: ${MAPS_REALTIME_TICKET_SECRET:-tea-maps-local-realtime-ticket-secret-change-me}
    ports:
      - "127.0.0.1:8787:44100"
    volumes:
      - maps-collaboration-data:/app/.celld
    labels:
      traefik.enable: "true"
      traefik.http.routers.maps-collaboration.rule: "Host(`maps-sync.localhost`)"
      traefik.http.routers.maps-collaboration.entrypoints: web
      traefik.http.services.maps-collaboration.loadbalancer.server.port: "44100"
    networks:
      - web

  maps-service:
    build:
      context: .
      dockerfile: apps/maps-service/Dockerfile
    environment:
      TEA_MAPS_URL: http://localhost:8790
      TEA_MAPS_COLLABORATION_URL: http://maps-collaboration:44100
      TEA_MAPS_REALTIME_TICKET_SECRET: ${MAPS_REALTIME_TICKET_SECRET:-tea-maps-local-realtime-ticket-secret-change-me}
      FOURM_URL: ${FOURM_URL:-http://host.docker.internal:8000}
      TEA_MAPS_ARTBIN_URL: ${TEA_MAPS_ARTBIN_URL:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.jackharrhy.dev}
      AUTH_ARTBIN_PROJECT_ID: ${AUTH_ARTBIN_PROJECT_ID:-}
      AUTH_ARTBIN_CLIENT_ID: ${AUTH_ARTBIN_CLIENT_ID:-}
      AUTH_ARTBIN_CLIENT_SECRET: ${AUTH_ARTBIN_CLIENT_SECRET:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8792:8792"
    volumes:
      - maps-service-data:/app/data
    depends_on:
      - maps-collaboration
    networks:
      - web

  maps-compiler:
    profiles: [native-compiler]
    build:
      context: .
      dockerfile: apps/maps-compiler/Dockerfile
    environment:
      TEA_MAPS_COMPILER_HOST: 0.0.0.0
      ERICW_QBSP: /opt/ericw-tools/qbsp
      ERICW_VIS: /opt/ericw-tools/vis
      ERICW_LIGHT: /opt/ericw-tools/light
    volumes:
      - ${ERICW_TOOLS_DIR:-/tmp/tea-ericw-tools}:/opt/ericw-tools:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks:
      - web

volumes:
  artbin-data:
  artbin-uploads:
  artbin-tmp:
  cms-data:
  letters-to-steve-data:
  marky-data:
  ref-data:
  radio-data:
  maps-data:
  maps-collaboration-data:
  maps-service-data:

configs:
  andrew-local-site:
    content: |
      {"origin":"http://andrew.localhost"}
  luke-local-site:
    content: |
      {"origin":"http://luke.localhost"}

networks:
  web:
