services:
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      TEA_DATA_DIR: /app/data
    volumes:
      - cms-data:/app/data
    configs:
      - source: andrew-local-site
        target: /app/apps/cms/sites/andrew/site.local.json
      - source: luke-local-site
        target: /app/apps/cms/sites/luke/site.local.json
    labels:
      traefik.enable: "true"
      traefik.http.routers.cms-andrew.rule: "Host(`andrew.localhost`)"
      traefik.http.routers.cms-andrew.entrypoints: web
      traefik.http.routers.cms-andrew.service: cms
      traefik.http.routers.cms-luke.rule: "Host(`luke.localhost`)"
      traefik.http.routers.cms-luke.entrypoints: web
      traefik.http.routers.cms-luke.service: cms
      traefik.http.services.cms.loadbalancer.server.port: "4351"
    networks:
      - web

  shell-mcp:
    build:
      context: .
      dockerfile: apps/shell-mcp/Dockerfile
    environment:
      SHELL_MODE: locked
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_ORIGIN: http://shell.localhost
    labels:
      traefik.enable: "true"
      traefik.http.routers.shell-mcp.rule: "Host(`shell.localhost`)"
      traefik.http.routers.shell-mcp.entrypoints: web
      traefik.http.services.shell-mcp.loadbalancer.server.port: "3000"
    networks:
      - web

  ref:
    build:
      context: .
      dockerfile: apps/ref/Dockerfile
    environment:
      CELLD_VAR_REF_PASSWORD: ${REF_PASSWORD:-tea-ref-local-password}
    volumes:
      - ref-data:/app/.celld
    labels:
      traefik.enable: "true"
      traefik.http.routers.ref.rule: "Host(`ref.localhost`)"
      traefik.http.routers.ref.entrypoints: web
      traefik.http.services.ref.loadbalancer.server.port: "8080"
    networks:
      - web

  radio:
    build:
      context: .
      dockerfile: apps/radio/Dockerfile
    environment:
      CELLD_VAR_RADIO_PASSWORD: ${RADIO_PASSWORD:-tea-radio-local-password}
      CELLD_VAR_RADIO_SESSION_SECRET: ${RADIO_SESSION_SECRET:-tea-radio-local-session-secret-change-me}
    volumes:
      - radio-data:/app/.celld
    labels:
      traefik.enable: "true"
      traefik.http.routers.radio.rule: "Host(`radio.localhost`)"
      traefik.http.routers.radio.entrypoints: web
      traefik.http.services.radio.loadbalancer.server.port: "44100"
    networks:
      - web

  maps-collaboration:
    build:
      context: .
      dockerfile: apps/maps-collaboration/Dockerfile
    environment:
      CELLD_VAR_TEA_MAPS_REALTIME_TICKET_SECRET: ${MAPS_REALTIME_TICKET_SECRET:-tea-maps-local-realtime-ticket-secret-change-me}
    ports:
      - "127.0.0.1:8787:44100"
    volumes:
      - maps-collaboration-data:/app/.celld
    labels:
      traefik.enable: "true"
      traefik.http.routers.maps-collaboration.rule: "Host(`maps-sync.localhost`)"
      traefik.http.routers.maps-collaboration.entrypoints: web
      traefik.http.services.maps-collaboration.loadbalancer.server.port: "44100"
    networks:
      - web

  maps-service:
    build:
      context: .
      dockerfile: apps/maps-service/Dockerfile
    environment:
      TEA_MAPS_URL: http://localhost:8790
      TEA_MAPS_COLLABORATION_URL: http://maps-collaboration:44100
      TEA_MAPS_REALTIME_TICKET_SECRET: ${MAPS_REALTIME_TICKET_SECRET:-tea-maps-local-realtime-ticket-secret-change-me}
      FOURM_URL: ${FOURM_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8792:8792"
    volumes:
      - maps-service-data:/app/data
    depends_on:
      - maps-collaboration
    networks:
      - web

volumes:
  cms-data:
  ref-data:
  radio-data:
  maps-collaboration-data:
  maps-service-data:

configs:
  andrew-local-site:
    content: |
      {"origin":"http://andrew.localhost"}
  luke-local-site:
    content: |
      {"origin":"http://luke.localhost"}

networks:
  web:
