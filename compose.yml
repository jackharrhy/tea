services:
  auth:
    profiles: [auth]
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    environment:
      NODE_ENV: development
      PUBLIC_ORIGIN: http://auth.localhost
      ZITADEL_API_URL: ${AUTH_DEV_ISSUER:-http://auth.localhost}
      ORGANIZATION_ID: ${AUTH_DEV_ORGANIZATION_ID:-fixture-only}
      LORE_PROJECT_ID: ${AUTH_DEV_LORE_PROJECT_ID:-fixture-only}
      LORE_CLIENT_ID: ${AUTH_DEV_LORE_CLIENT_ID:-fixture-only}
    labels:
      traefik.enable: "true"
      traefik.http.routers.auth.rule: "Host(`auth.localhost`)"
      traefik.http.routers.auth.entrypoints: web
      traefik.http.services.auth.loadbalancer.server.port: "3000"
    networks:
      - web

  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  garden:
    profiles: [garden]
    build:
      context: .
      dockerfile: apps/garden/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      GARDEN_VAULT_PATH: /vault/Garden
      GARDEN_VAULT_ASSETS_PATH: /vault/Assets
    volumes:
      - ${GARDEN_VAULT_ROOT:-./apps/garden/tmp/vault}:/vault:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.garden.rule: "Host(`garden.localhost`)"
      traefik.http.routers.garden.entrypoints: web
      traefik.http.services.garden.loadbalancer.server.port: "4322"
    networks:
      - web

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      TEA_DATA_DIR: /app/data
    volumes:
      - cms-data:/app/data
    configs:
      - source: andrew-local-site
        target: /app/apps/cms/sites/andrew/site.local.json
      - source: luke-local-site
        target: /app/apps/cms/sites/luke/site.local.json
    labels:
      traefik.enable: "true"
      traefik.http.routers.cms-andrew.rule: "Host(`andrew.localhost`)"
      traefik.http.routers.cms-andrew.entrypoints: web
      traefik.http.routers.cms-andrew.service: cms
      traefik.http.routers.cms-luke.rule: "Host(`luke.localhost`)"
      traefik.http.routers.cms-luke.entrypoints: web
      traefik.http.routers.cms-luke.service: cms
      traefik.http.services.cms.loadbalancer.server.port: "4351"
    networks:
      - web

  artbin:
    build:
      context: .
      dockerfile: apps/artbin/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      ARTBIN_URL: http://artbin.localhost
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.jackharrhy.dev}
      AUTH_CLIENT_ID: ${ARTBIN_AUTH_CLIENT_ID:-}
      AUTH_PROJECT_ID: ${AUTH_ARTBIN_PROJECT_ID:-}
      AUTH_ORGANIZATION_ID: ${AUTH_ORGANIZATION_ID:-}
      AUTH_INTROSPECTION_CLIENT_ID: ${ARTBIN_AUTH_INTROSPECTION_CLIENT_ID:-}
      AUTH_INTROSPECTION_SECRET: ${ARTBIN_AUTH_INTROSPECTION_SECRET:-}
    volumes:
      - artbin-data:/app/apps/artbin/data
      - artbin-uploads:/app/apps/artbin/public/uploads
      - artbin-tmp:/app/apps/artbin/tmp/uploads
    labels:
      traefik.enable: "true"
      traefik.http.routers.artbin.rule: "Host(`artbin.localhost`)"
      traefik.http.routers.artbin.entrypoints: web
      traefik.http.services.artbin.loadbalancer.server.port: "3000"
    networks:
      - web

  burger:
    profiles: [burger]
    build:
      context: .
      dockerfile: apps/burger/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "5000"
      BURGER_URL: http://burger.localhost
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.jackharrhy.dev}
      AUTH_CLIENT_ID: ${BURGER_AUTH_CLIENT_ID:-}
      AUTH_PROJECT_ID: ${AUTH_BURGER_PROJECT_ID:-}
    volumes:
      - burger-data:/app/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.burger.rule: "Host(`burger.localhost`)"
      traefik.http.routers.burger.entrypoints: web
      traefik.http.services.burger.loadbalancer.server.port: "5000"
    networks:
      - web

  marky:
    build:
      context: .
      dockerfile: apps/marky/Dockerfile
    environment:
      MARKY_AUTH: anonymous
      MARKY_CONTENT_DIR: /app/data/content
    volumes:
      - marky-data:/app/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.marky.rule: "Host(`md.localhost`)"
      traefik.http.routers.marky.entrypoints: web
      traefik.http.services.marky.loadbalancer.server.port: "44100"
    networks:
      - web

  rotund:
    profiles: [rotund]
    build:
      context: .
      dockerfile: apps/rotund/Dockerfile
    environment:
      APP_ORIGIN: ${ROTUND_APP_ORIGIN:-https://rotund.localhost}
      AUTH_ISSUER: ${ROTUND_AUTH_ISSUER:-https://auth.jackharrhy.dev}
      AUTH_CLIENT_ID: ${ROTUND_AUTH_CLIENT_ID:-}
      AUTH_CLIENT_SECRET: ${ROTUND_AUTH_CLIENT_SECRET:-}
      AUTH_SCOPES: ${ROTUND_AUTH_SCOPES:-}
      AUTH_ORGANIZATION_ID: ${ROTUND_AUTH_ORGANIZATION_ID:-}
      SERVICE_BINDINGS: ${ROTUND_SERVICE_BINDINGS:-}
      SESSION_SECRET: ${ROTUND_SESSION_SECRET:-}
    labels:
      traefik.enable: "true"
      traefik.http.routers.rotund.rule: "Host(`rotund.localhost`)"
      traefik.http.routers.rotund.entrypoints: web
      traefik.http.services.rotund.loadbalancer.server.port: "80"
    networks:
      - web

  8mb:
    profiles: [8mb]
    build:
      context: .
      dockerfile: apps/8mb/Dockerfile
    environment:
      APP_ORIGIN: http://8mb.localhost
      DIAGNOSTICS_DB_FILE: /app/data/diagnostics.sqlite
    volumes:
      - 8mb-data:/app/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.8mb.rule: "Host(`8mb.localhost`)"
      traefik.http.routers.8mb.entrypoints: web
      traefik.http.services.8mb.loadbalancer.server.port: "5188"
    networks:
      - web

  pool:
    build:
      context: .
      dockerfile: apps/pool/Dockerfile
    environment:
      PUBLIC_ORIGIN: http://pool.localhost
    volumes:
      - pool-data:/app/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.pool.rule: "Host(`pool.localhost`)"
      traefik.http.routers.pool.entrypoints: web
      traefik.http.services.pool.loadbalancer.server.port: "3188"
    networks:
      - web

  letters-to-steve:
    build:
      context: .
      dockerfile: apps/letters-to-steve/Dockerfile
    environment:
      STEVE_ADMIN_PASSWORD: ${STEVE_ADMIN_PASSWORD:-tea-letters-local-password}
      DATABASE_PATH: /app/data/letters.sqlite
      UPLOAD_DIRECTORY: /app/data/uploads
      TRUST_PROXY: "true"
    volumes:
      - letters-to-steve-data:/app/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.letters-to-steve.rule: "Host(`letters.localhost`)"
      traefik.http.routers.letters-to-steve.entrypoints: web
      traefik.http.services.letters-to-steve.loadbalancer.server.port: "44110"
    networks:
      - web

  lists-moto:
    profiles: [lists]
    image: ghcr.io/getmoto/motoserver:5.1.22
    environment:
      MOTO_PORT: "5000"
    ports:
      - "127.0.0.1:${LISTS_MOTO_PORT:-15000}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - web

  lists-aws-init:
    profiles: [lists]
    image: public.ecr.aws/aws-cli/aws-cli:2.27.49
    depends_on:
      lists-moto:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws --endpoint-url http://lists-moto:5000 s3api head-bucket --bucket lists-inbound 2>/dev/null || aws --endpoint-url http://lists-moto:5000 s3api create-bucket --bucket lists-inbound
        aws --endpoint-url http://lists-moto:5000 s3api head-bucket --bucket lists-media 2>/dev/null || aws --endpoint-url http://lists-moto:5000 s3api create-bucket --bucket lists-media
        aws --endpoint-url http://lists-moto:5000 sqs create-queue --queue-name lists-inbound
        aws --endpoint-url http://lists-moto:5000 sesv2 create-email-identity --email-identity lists.local
    networks:
      - web

  lists-mailpit:
    profiles: [lists]
    image: axllent/mailpit:v1.30.4
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    volumes:
      - lists-mailpit-data:/data
    ports:
      - "127.0.0.1:${LISTS_MAILPIT_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - web

  lists:
    profiles: [lists]
    stop_grace_period: 40s
    build:
      context: .
      dockerfile: apps/lists/Dockerfile
    depends_on:
      lists-aws-init:
        condition: service_completed_successfully
      lists-mailpit:
        condition: service_healthy
    environment:
      NODE_ENV: development
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://lists-moto:5000
      SQS_QUEUE_URL: http://lists-moto:5000/123456789012/lists-inbound
      S3_BUCKET: lists-inbound
      S3_MEDIA_BUCKET: lists-media
      S3_MEDIA_BASE_URL: ${LISTS_S3_MEDIA_BASE_URL:-http://localhost:15000/lists-media}
      SMTP_URL: smtp://lists-mailpit:1025
      BASE_URL: ${LISTS_BASE_URL:-http://localhost:18080}
      FROM_DOMAIN: lists.local
      DB_PATH: /data/lists.db
      OWNER_EMAIL: owner@lists.local
      OWNER_PASSWORD: local-password
      PUBLIC_SUBSCRIPTIONS_ENABLED: "true"
    volumes:
      - lists-data:/data
    ports:
      - "127.0.0.1:${LISTS_APP_PORT:-18080}:8080"
    labels:
      traefik.enable: "true"
      traefik.http.routers.lists.rule: "Host(`lists.localhost`)"
      traefik.http.routers.lists.entrypoints: web
      traefik.http.services.lists.loadbalancer.server.port: "8080"
    networks:
      - web

  ref-dev-auth:
    image: node:26-alpine
    command: ["node", "/app/dev-auth.mjs"]
    environment:
      HARRHY_DEV_AUTH_BIND: 0.0.0.0
      HARRHY_DEV_AUTH_ORIGIN: http://ref-auth.localhost:8786
      HARRHY_DEV_AUTH_CALLBACK: http://ref.localhost/auth/callback
    volumes:
      - ./packages/dev-auth/server.mjs:/app/dev-auth.mjs:ro
      - ./packages/dev-auth/apps.json:/app/apps.json:ro
    ports:
      - "127.0.0.1:8786:8786"
    read_only: true
    networks:
      web:
        aliases:
          - ref-auth.localhost

  ref:
    build:
      context: .
      dockerfile: apps/ref/Dockerfile
    depends_on:
      - ref-dev-auth
    environment:
      CELLD_VAR_AUTH_ISSUER: ${REF_AUTH_ISSUER:-http://ref-auth.localhost:8786}
      CELLD_VAR_AUTH_CLIENT_ID: ${REF_AUTH_CLIENT_ID:-ref-local-browser}
      CELLD_VAR_AUTH_PROJECT_ID: ${REF_AUTH_PROJECT_ID:-ref-local-project}
      CELLD_VAR_AUTH_ORGANIZATION_ID: ${REF_AUTH_ORGANIZATION_ID:-ref-local-org}
      CELLD_VAR_AUTH_PUBLIC_ORIGIN: ${REF_AUTH_PUBLIC_ORIGIN:-http://ref.localhost}
      CELLD_VAR_AUTH_INTROSPECTION_CLIENT_ID: ${REF_AUTH_INTROSPECTION_CLIENT_ID:-ref-local-resource}
      CELLD_VAR_AUTH_INTROSPECTION_SECRET: ${REF_AUTH_INTROSPECTION_SECRET:-ref-local-resource-secret}
    volumes:
      - ref-data:/app/.celld
    labels:
      traefik.enable: "true"
      traefik.http.routers.ref.rule: "Host(`ref.localhost`)"
      traefik.http.routers.ref.entrypoints: web
      traefik.http.services.ref.loadbalancer.server.port: "8080"
    networks:
      - web

  radio:
    build:
      context: .
      dockerfile: apps/radio/Dockerfile
    environment:
      CELLD_VAR_AUTH_ISSUER: ${RADIO_AUTH_ISSUER:-https://auth.jackharrhy.dev}
      CELLD_VAR_AUTH_CLIENT_ID: ${RADIO_AUTH_CLIENT_ID:-local-unregistered}
      CELLD_VAR_AUTH_PROJECT_ID: ${RADIO_AUTH_PROJECT_ID:-local-unregistered}
      CELLD_VAR_AUTH_ORGANIZATION_ID: ${RADIO_AUTH_ORGANIZATION_ID:-local-unregistered}
      CELLD_VAR_AUTH_PUBLIC_ORIGIN: ${RADIO_AUTH_PUBLIC_ORIGIN:-https://radio.localhost}
      CELLD_VAR_RADIO_SESSION_SECRET: ${RADIO_SESSION_SECRET:-tea-radio-local-session-secret-change-me}
    volumes:
      - radio-data:/app/.celld
    labels:
      traefik.enable: "true"
      traefik.http.routers.radio.rule: "Host(`radio.localhost`)"
      traefik.http.routers.radio.entrypoints: web
      traefik.http.services.radio.loadbalancer.server.port: "44100"
    networks:
      - web

  worldview:
    build:
      context: .
      dockerfile: apps/worldview/Dockerfile
    environment:
      CELLD_VAR_MAPS_SERVICE_ORIGIN: http://maps-service:8792
      CELLD_VAR_MAPS_COLLABORATION_ORIGIN: http://maps-collaboration:44100
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - maps-data:/app/.celld
    depends_on:
      - maps-service
      - maps-collaboration
    labels:
      traefik.enable: "true"
      traefik.http.routers.worldview.rule: "Host(`worldview.localhost`)"
      traefik.http.routers.worldview.entrypoints: web
      traefik.http.services.worldview.loadbalancer.server.port: "8790"
    networks:
      - web

  maps-collaboration:
    build:
      context: .
      dockerfile: apps/maps-collaboration/Dockerfile
    environment:
      CELLD_VAR_TEA_MAPS_REALTIME_TICKET_SECRET: ${MAPS_REALTIME_TICKET_SECRET:-tea-maps-local-realtime-ticket-secret-change-me}
    ports:
      - "127.0.0.1:8787:44100"
    volumes:
      - maps-collaboration-data:/app/.celld
    labels:
      traefik.enable: "true"
      traefik.http.routers.maps-collaboration.rule: "Host(`maps-sync.localhost`)"
      traefik.http.routers.maps-collaboration.entrypoints: web
      traefik.http.services.maps-collaboration.loadbalancer.server.port: "44100"
    networks:
      - web

  maps-service:
    build:
      context: .
      dockerfile: apps/maps-service/Dockerfile
    environment:
      TEA_MAPS_URL: http://localhost:8790
      TEA_MAPS_COLLABORATION_URL: http://maps-collaboration:44100
      TEA_MAPS_REALTIME_TICKET_SECRET: ${MAPS_REALTIME_TICKET_SECRET:-tea-maps-local-realtime-ticket-secret-change-me}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.jackharrhy.dev}
      AUTH_CLIENT_ID: ${MAPS_AUTH_CLIENT_ID:-}
      AUTH_PROJECT_ID: ${AUTH_MAPS_PROJECT_ID:-}
      AUTH_ORGANIZATION_ID: ${AUTH_ORGANIZATION_ID:-}
      AUTH_INTROSPECTION_CLIENT_ID: ${MAPS_AUTH_INTROSPECTION_CLIENT_ID:-}
      AUTH_INTROSPECTION_SECRET: ${MAPS_AUTH_INTROSPECTION_SECRET:-}
      TEA_MAPS_ARTBIN_URL: ${TEA_MAPS_ARTBIN_URL:-}
      AUTH_ARTBIN_PROJECT_ID: ${AUTH_ARTBIN_PROJECT_ID:-}
      AUTH_ARTBIN_CLIENT_ID: ${AUTH_ARTBIN_CLIENT_ID:-}
      AUTH_ARTBIN_CLIENT_SECRET: ${AUTH_ARTBIN_CLIENT_SECRET:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8792:8792"
    volumes:
      - maps-service-data:/app/data
    depends_on:
      - maps-collaboration
    networks:
      - web

  maps-compiler:
    profiles: [native-compiler]
    build:
      context: .
      dockerfile: apps/maps-compiler/Dockerfile
    environment:
      TEA_MAPS_COMPILER_HOST: 0.0.0.0
      ERICW_QBSP: /opt/ericw-tools/qbsp
      ERICW_VIS: /opt/ericw-tools/vis
      ERICW_LIGHT: /opt/ericw-tools/light
    volumes:
      - ${ERICW_TOOLS_DIR:-/tmp/tea-ericw-tools}:/opt/ericw-tools:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks:
      - web

  gurgur:
    profiles: [gurgur]
    build:
      context: .
      dockerfile: apps/gurgur/Dockerfile
    network_mode: host
    environment:
      PORT: "8814"
      HOST: 127.0.0.1
      DATABASE_PATH: /app/data/world.sqlite
      PUBLIC_ORIGIN: http://127.0.0.1:8814
      RTC_PORT_MIN: "41160"
      RTC_PORT_MAX: "41210"
      GURGUR_DEV_MCP: "0"
    volumes:
      - gurgur-data:/app/data

volumes:
  8mb-data:
  artbin-data:
  artbin-uploads:
  artbin-tmp:
  burger-data:
  cms-data:
  letters-to-steve-data:
  lists-data:
  lists-mailpit-data:
  marky-data:
  pool-data:
  ref-data:
  radio-data:
  maps-data:
  maps-collaboration-data:
  maps-service-data:
  gurgur-data:

configs:
  andrew-local-site:
    content: |
      {"origin":"http://andrew.localhost"}
  luke-local-site:
    content: |
      {"origin":"http://luke.localhost"}

networks:
  web:
