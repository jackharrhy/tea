name: Publish Auth
on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .nvmrc
      - package.json
      - package-lock.json
      - apps/auth/**
      - packages/**
  workflow_dispatch:
concurrency:
  group: publish-auth
  cancel-in-progress: false
permissions: {}
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: apps
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci/publish-impact.mjs auth
  publish:
    needs: select
    if: needs.select.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --allow-remote=all
      - run: npx playwright install --only-shell chromium
      - run: npm run check --workspace @harrhy/auth
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/auth/Dockerfile
          push: true
          tags: |
            ghcr.io/jackharrhy/auth:latest
            ghcr.io/jackharrhy/auth:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jackharrhy/harrhy
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show deployable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jackharrhy/auth@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
