name: Publish Worldview
on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .nvmrc
      - package.json
      - package-lock.json
      - apps/worldview/**
      - apps/maps-service/**
      - apps/maps-collaboration/**
      - apps/maps-compiler/**
      - packages/**
  workflow_dispatch:
concurrency:
  group: publish-worldview
  cancel-in-progress: false
permissions: {}
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: apps
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci/publish-impact.mjs worldview maps-service maps-collaboration maps-compiler
  publish:
    needs: select
    if: needs.select.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.select.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose image name
        id: image
        env:
          APP: ${{ matrix.app }}
        run: |
          case "$APP" in
            worldview) name=worldview ;;
            maps-service) name=worldview-service ;;
            maps-collaboration) name=worldview-collaboration ;;
            maps-compiler) name=worldview-compiler ;;
            *) exit 1 ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Set image tags
        id: tags
        run: |
          tags="ghcr.io/jackharrhy/${{ steps.image.outputs.name }}:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            tags="$tags,ghcr.io/jackharrhy/${{ steps.image.outputs.name }}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/jackharrhy/harrhy
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show deployable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jackharrhy/${{ steps.image.outputs.name }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
