name: Publish Ref
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ref.yml
      - .dockerignore
      - .nvmrc
      - scripts/security/**
      - package.json
      - package-lock.json
      - apps/ref/**
  workflow_dispatch:
concurrency:
  group: publish-ref
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ref:check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ref/Dockerfile
          push: true
          tags: |
            ghcr.io/jackharrhy/tea-ref:latest
            ghcr.io/jackharrhy/tea-ref:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jackharrhy/tea
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show deployable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jackharrhy/tea-ref@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
