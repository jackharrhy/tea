name: Publish World games
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-world-games.yml
      - .dockerignore
      - .nvmrc
      - package.json
      - package-lock.json
      - apps/pool/**
      - apps/burger/**
      - apps/gurgur/**
      - packages/pool/**
      - packages/pool-protocol/**
      - packages/pool-simulation/**
      - packages/burger-core/**
      - packages/gurgur-engine/**
      - packages/gurgur-game/**
  workflow_dispatch:
concurrency:
  group: publish-world-games
  cancel-in-progress: false
permissions: {}
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: apps
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          app_paths = {
              "pool": ("apps/pool/", "packages/pool/", "packages/pool-protocol/", "packages/pool-simulation/"),
              "burger": ("apps/burger/", "packages/burger-core/"),
              "gurgur": ("apps/gurgur/", "packages/gurgur-engine/", "packages/gurgur-game/"),
          }
          before = os.environ.get("BEFORE", "")
          if os.environ["EVENT"] == "workflow_dispatch" or not before or set(before) == {"0"}:
              selected = list(app_paths)
          else:
              paths = subprocess.check_output(
                  ["git", "diff", "--name-only", before, os.environ["GITHUB_SHA"]],
                  text=True,
              ).splitlines()
              shared = any(path in {
                  ".github/workflows/publish-world-games.yml", ".dockerignore", ".nvmrc",
                  "package.json", "package-lock.json",
              } for path in paths)
              selected = list(app_paths) if shared else [
                  app for app, prefixes in app_paths.items()
                  if any(path.startswith(prefixes) for path in paths)
              ]
          print("apps=" + json.dumps(selected))
          PY
  publish:
    needs: select
    if: needs.select.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.select.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            APP_REVISION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/jackharrhy/tea-${{ matrix.app }}:latest
            ghcr.io/jackharrhy/tea-${{ matrix.app }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jackharrhy/tea
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show deployable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jackharrhy/tea-${{ matrix.app }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
