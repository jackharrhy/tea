name: Publish Radio
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-radio.yml
      - .dockerignore
      - .nvmrc
      - package.json
      - package-lock.json
      - apps/radio/**
  workflow_dispatch:
concurrency:
  group: publish-radio
  cancel-in-progress: false
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --only-shell chromium
      - run: npm run radio:check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/radio/Dockerfile
          push: true
          tags: |
            ghcr.io/jackharrhy/tea-radio:latest
            ghcr.io/jackharrhy/tea-radio:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jackharrhy/tea
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show deployable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jackharrhy/tea-radio@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
