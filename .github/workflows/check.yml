name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      cms: ${{ steps.select.outputs.cms }}
      edge: ${{ steps.select.outputs.edge }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/ci/__tests__/affected.test.mjs
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/affected.mjs

  cms:
    needs: affected
    if: needs.affected.outputs.cms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:cms
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser --workspace @tea/cms

  cms-edge:
    needs: affected
    if: needs.affected.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:cms-edge
