name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --test scripts/ci/__tests__/affected.test.mjs
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/affected.mjs
      - if: steps.select.outputs.any == 'true'
        run: npm ci
      - if: steps.select.outputs.any == 'true'
        run: npm run tooling:check
      - if: steps.select.outputs.any == 'true'
        env:
          SELECTED_CHECKS: ${{ steps.select.outputs.selected }}
        run: node scripts/ci/run-checks.mjs
      - if: steps.select.outputs.cms == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.select.outputs.cms == 'true'
        run: npm run test:browser --workspace @tea/cms
