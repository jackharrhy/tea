name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      cms: ${{ steps.select.outputs.cms }}
      edge: ${{ steps.select.outputs.edge }}
      shell: ${{ steps.select.outputs.shell }}
      body: ${{ steps.select.outputs.body }}
      mcp: ${{ steps.select.outputs.mcp }}
      schema: ${{ steps.select.outputs.schema }}
      logger: ${{ steps.select.outputs.logger }}
      result: ${{ steps.select.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/ci/__tests__/affected.test.mjs
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/affected.mjs

  cms:
    needs: affected
    if: needs.affected.outputs.cms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run cms:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser --workspace @tea/cms

  cms-edge:
    needs: affected
    if: needs.affected.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run cms-edge:check

  shell-mcp:
    needs: affected
    if: needs.affected.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run shell-mcp:check

  request-body:
    needs: affected
    if: needs.affected.outputs.body == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run request-body:check

  mcp:
    needs: affected
    if: needs.affected.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run mcp:check

  json-schema:
    needs: affected
    if: needs.affected.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run json-schema:check

  logger:
    needs: affected
    if: needs.affected.outputs.logger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run logger:check

  result:
    needs: affected
    if: needs.affected.outputs.result == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run result:check
