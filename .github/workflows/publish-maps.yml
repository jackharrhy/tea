name: Publish Maps
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-maps.yml
      - .dockerignore
      - .nvmrc
      - package.json
      - package-lock.json
      - apps/maps/**
      - apps/maps-service/**
      - apps/maps-collaboration/**
      - apps/maps-compiler/**
      - packages/maps-editor/**
      - packages/maps-protocol/**
      - packages/maps-renderer/**
      - packages/request-body/**
  workflow_dispatch:
concurrency:
  group: publish-maps
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [maps, maps-service, maps-collaboration, maps-compiler]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: tags
        run: |
          tags="ghcr.io/jackharrhy/tea-${{ matrix.app }}:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            tags="$tags,ghcr.io/jackharrhy/tea-${{ matrix.app }}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/jackharrhy/tea
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show deployable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jackharrhy/tea-${{ matrix.app }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
