name: Publish Maps
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-maps.yml
      - .dockerignore
      - .nvmrc
      - package.json
      - package-lock.json
      - apps/maps/**
      - apps/maps-service/**
      - apps/maps-collaboration/**
      - apps/maps-compiler/**
      - packages/maps-editor/**
      - packages/maps-protocol/**
      - packages/maps-renderer/**
      - packages/request-body/**
  workflow_dispatch:
concurrency:
  group: publish-maps
  cancel-in-progress: false
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [maps, maps-service, maps-collaboration, maps-compiler]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: tags
        run: |
          tags="ghcr.io/jackharrhy/tea-${{ matrix.app }}:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            tags="$tags,ghcr.io/jackharrhy/tea-${{ matrix.app }}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/jackharrhy/tea
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show deployable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jackharrhy/tea-${{ matrix.app }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
