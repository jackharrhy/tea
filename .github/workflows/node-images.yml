name: Node images
on:
  # Always report every existing smoke matrix check, including no-op PRs.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.select.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/ci/__tests__/*.test.mjs
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci/node-image-impact.mjs
  smoke:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app:
          [
            cms,
            auth,
            artbin,
            letters-to-steve,
            marky,
            maps-service,
            maps-compiler,
            rotund,
            8mb,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(fromJSON(needs.select.outputs.apps), matrix.app)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: contains(fromJSON(needs.select.outputs.apps), matrix.app)
        with:
          node-version-file: .nvmrc
      - name: Build production image
        if: contains(fromJSON(needs.select.outputs.apps), matrix.app)
        env:
          APP: ${{ matrix.app }}
        run: docker build --tag tea-smoke --file "apps/$APP/Dockerfile" .
      - name: Check runtime, native modules, migrations and requests
        if: contains(fromJSON(needs.select.outputs.apps), matrix.app)
        env:
          APP: ${{ matrix.app }}
        run: node scripts/ci/node-image-smoke.mjs "$APP" tea-smoke
      - name: Check Gower compiler configuration
        if: matrix.app == 'maps-compiler' && contains(fromJSON(needs.select.outputs.apps), matrix.app)
        run: node scripts/ci/node-image-smoke.mjs maps-compiler tea-smoke gower
      - name: Report image selection
        env:
          APP: ${{ matrix.app }}
          SELECTED: ${{ contains(fromJSON(needs.select.outputs.apps), matrix.app) }}
        run: echo "$APP image selected=$SELECTED" >> "$GITHUB_STEP_SUMMARY"
